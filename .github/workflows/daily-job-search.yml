name: Daily Job Search

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run job search
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_search.py

      - name: Commit updated portal
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@github.com"
          git add index.html jobs.json
          if git diff --cached --quiet; then
            echo "No changes today"
          else
            git commit -m "Daily job search update $(date -u +%Y-%m-%d)"
            git push
          fi
